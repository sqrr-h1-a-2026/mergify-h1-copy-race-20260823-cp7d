pull_request_rules:
  - name: controlled fork approved-source copy cp7d
    conditions:
      - label = h1-copy-approved-cp7d
      - base = main
      - "#approved-reviews-by >= 1"
    actions:
      copy:
        branches:
          - release
  - name: controlled target-CI generated-copy merge cp7d
    conditions:
      - author = mergify[bot]
      - base = release
      - check-success = H1_COPY_RELEASE_CI_CP7D
    actions:
      merge:
        method: squash
